name: Java CI with Maven and Checkstyle

on:
  push:
    branches: [ master, feat/** ]

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn compile

  style-check:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Code Style Check
        run: mvn clean validate
